[project]
name = "tjbot-ce"
version = "3.0.0"
description = "Python library for writing TJBot recipes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.2",
    "rpi-lgpio>=0.6; sys_platform == 'linux'",
    "pigpio>=1.78; sys_platform == 'linux'",
    "rpi-ws281x>=5.0.0; sys_platform == 'linux'",
    "gpiozero>=2.0",
    "ibm-watson>=7.0.0",
    "azure-cognitiveservices-speech>=1.34.0",
    "azure-cognitiveservices-vision-computervision>=0.9.0",
    "google-cloud-speech>=2.0.0",
    "google-cloud-texttospeech>=2.27.0",
    "google-cloud-vision>=3.10.2",
    "sherpa-onnx>=1.10.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "webcolors>=1.13",
    "spidev>=3.6; sys_platform == 'linux'",
    "numpy>=2.0.2",
    "pillow>=11.3.0",
    "onnxruntime==1.24.4",
    "jsonschema>=4.23.0",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.8.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "pdoc>=14.6.0",
    "InquirerPy>=0.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.8.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "pdoc>=14.6.0",
    "InquirerPy>=0.3.4",
    "pytest-cov>=7.1.0",
    "pymarkdownlnt>=0.9.37",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/tjbot"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"

[tool.mypy]
python_version = "3.11"
strict = false

[[tool.mypy.overrides]]
module = [
    "gpiozero",
    "lgpio",
    "ibm_watson",
    "ibm_cloud_sdk_core.*",
    "azure.cognitiveservices.*",
    "onnxruntime",
    "webcolors",
    "google.cloud.*",
    "msrest.*",
    "picamera2",
    "spidev",
    "rpi_ws281x",
    "pigpio",
    "RPi.*",
    "requests",
    "yaml",
    "jsonschema",
    "jsonschema.*",
    "sherpa_onnx",
]
ignore_missing_imports = true
